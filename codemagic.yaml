workflows:
  ios-development:
    name: TwinBirthRoleplay iOS Hobby Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      xcode: latest
    scripts:
      - name: Build unsigned iPhone app
        script: |
          xcodebuild -project TwinBirthRoleplay.xcodeproj \
                     -scheme TwinBirthRoleplay \
                     -configuration Release \
                     -sdk iphoneos \
                     -allowProvisioningUpdates \
                     CODE_SIGNING_ALLOWED=NO
          
          # 3uTools 인식용 표준 IPA 구조 생성 (매우 중요)
          mkdir -p build/ios/ipa/Payload
          cp -r /Users/builder/Library/Developer/Xcode/DerivedData/*/Build/Products/Release-iphoneos/TwinBirthRoleplay.app build/ios/ipa/Payload/
          cd build/ios/ipa
          zip -r TwinBirthRoleplay.ipa Payload
    artifacts:
      - build/ios/ipa/*.ipa
