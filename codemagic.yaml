workflows:
  ios-testflight:
    name: TwinBirthRoleplay iOS TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: TwinBirthRoleplayASC
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.example.TwinBirthRoleplay
      xcode: latest
    scripts:
      - name: Apply signing profiles
        script: xcode-project use-profiles
      - name: Build signed iPhone app
        script: xcode-project build-ipa --project TwinBirthRoleplay.xcodeproj --scheme TwinBirthRoleplay
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
