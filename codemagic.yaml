workflows:
  ios-development:
    name: TwinBirthRoleplay iOS Hobby Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      xcode: latest
    scripts:
      - name: Build unsigned iPhone app
        script: |
          xcodebuild -project TwinBirthRoleplay.xcodeproj \
                     -scheme TwinBirthRoleplay \
                     -configuration Release \
                     -sdk iphoneos \
                     -allowProvisioningUpdates \
                     CODE_SIGNING_ALLOWED=NO
          
          # Info.plist와 필수 설정을 모두 포함하는 정석 압축 방식
          mkdir -p build/ios/ipa/Payload
          BUILT_APP_DIR=$(ls -d /Users/builder/Library/Developer/Xcode/DerivedData/*/Build/Products/Release-iphoneos/TwinBirthRoleplay.app 2>/dev/null | head -n 1)
          
          if [ -d "$BUILT_APP_DIR" ]; then
            cp -r "$BUILT_APP_DIR" build/ios/ipa/Payload/
            cd build/ios/ipa
            zip -r TwinBirthRoleplay.ipa Payload
          else
            echo "Error: Built app folder not found!"
            exit 1
          fi
    artifacts:
      - build/ios/ipa/*.ipa
