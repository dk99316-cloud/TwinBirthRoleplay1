workflows:
  ios-development:
    name: Lucius Story - iOS IPA Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      xcode: latest
    scripts:
      - name: Build offline iPhone app and package IPA
        script: |
          set -euo pipefail
          DERIVED="$CM_BUILD_DIR/derived-data"
          mkdir -p "$DERIVED"
          xcodebuild \
            -project "$CM_BUILD_DIR/LuciusStoryAppleAI.xcodeproj" \
            -scheme "LuciusStoryAppleAI" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$DERIVED" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build
          APP_PATH="$DERIVED/Build/Products/Release-iphoneos/LuciusStoryAppleAI.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "Error: app bundle was not created"
            exit 1
          fi
          mkdir -p "$CM_BUILD_DIR/Payload"
          cp -R "$APP_PATH" "$CM_BUILD_DIR/Payload/"
          cd "$CM_BUILD_DIR"
          zip -qry "$CM_BUILD_DIR/LuciusStoryAppleAI.ipa" Payload
    artifacts:
      - $CM_BUILD_DIR/LuciusStoryAppleAI.ipa
