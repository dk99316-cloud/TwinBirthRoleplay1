workflows:
  ios-development:
    name: TwinBirthRoleplay iOS Hobby Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      xcode: latest
    scripts:
      - name: Build unsigned iPhone app
        script: |
          xcodebuild -project TwinBirthRoleplay.xcodeproj -scheme TwinBirthRoleplay -configuration Release -sdk iphoneos -allowProvisioningUpdates CODE_SIGNING_ALLOWED=NO
          mkdir -p Payload
          cp -r /Users/builder/Library/Developer/Xcode/DerivedData/*/Build/Products/Release-iphoneos/TwinBirthRoleplay.app Payload/
          zip -r TwinBirthRoleplay.ipa Payload
    artifacts:
      - "*.ipa"
